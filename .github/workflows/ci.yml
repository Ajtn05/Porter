name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-tests:
    name: PorterKit tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version

      # Builds PorterKit and porterctl. `swift test` alone would never compile
      # the CLI, so a break in porterctl would go unnoticed.
      - name: Build
        working-directory: Kit
        run: swift build

      - name: Test
        working-directory: Kit
        run: swift test

  app-build:
    name: App build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Browser state checks
        run: bash Scripts/test-browser-state.sh

      # Porter.xcodeproj is not committed; project.yml is the source of truth.
      - name: Generate Porter.xcodeproj
        run: xcodegen generate

      # Compile without a signing identity, then ad hoc sign and verify the
      # app and embedded extension. This is not a distribution build.
      - name: Build Porter.app
        run: |
          mkdir -p build
          rm -rf build/Porter.app build/DerivedData DerivedData
          rm -f build/build-info.json
          trap 'rm -rf build/Porter.app' ERR
          xcodebuild build \
            -project Porter.xcodeproj \
            -scheme Porter \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build/build.log
          ditto build/DerivedData/Build/Products/Debug/Porter.app build/Porter.app
          codesign --force --sign - --timestamp=none --options runtime \
            --entitlements FileProvider/Resources/PorterFileProvider.entitlements \
            build/Porter.app/Contents/PlugIns/PorterFileProvider.appex
          codesign --force --sign - --timestamp=none --options runtime \
            --entitlements App/Resources/Porter.entitlements build/Porter.app
          codesign --verify --deep --strict --verbose=2 build/Porter.app
          plutil -lint build/Porter.app/Contents/Info.plist \
            build/Porter.app/Contents/PlugIns/PorterFileProvider.appex/Contents/Info.plist
          rm -rf build/DerivedData
