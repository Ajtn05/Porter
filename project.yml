name: Porter
options:
  bundleIdPrefix: app.porter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: R8P2P2R3S4
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      # Universal, so the shipped build is native on Apple silicon and Intel.
      ARCHS: "$(ARCHS_STANDARD)"
      ONLY_ACTIVE_ARCH: NO

targets:
  Porter:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
          - "Resources/platform-tools"
      - path: App/Resources/platform-tools
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: FileProviderShared
    dependencies:
      - target: PorterKit
      - target: PorterFileProvider
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.porter.mac
        PRODUCT_NAME: Porter
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Resources/Porter.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  PorterKit:
    type: library.static
    platform: macOS
    sources:
      - path: Kit/Sources/PorterKit
    settings:
      base:
        PRODUCT_MODULE_NAME: PorterKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  PorterFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProvider
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
      - path: FileProviderShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.porter.mac.fileprovider
        PRODUCT_NAME: PorterFileProvider
        INFOPLIST_FILE: FileProvider/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: FileProvider/Resources/PorterFileProvider.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Porter:
    build:
      targets:
        Porter: all
    run:
      config: Debug
    archive:
      config: Release
